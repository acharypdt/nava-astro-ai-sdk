name: Multi-Platform Build

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  build-web-and-sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Build Web
        run: npm run build

      - name: Build SDK
        run: |
          cd packages/sdk
          npm ci
          npm run build

  build-flutter:
    name: Flutter Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Check for Flutter project
        id: check_flutter
        run: |
          if [ -d "packages/nava_astro_flutter" ]; then
            echo "has_flutter=true" >> $GITHUB_OUTPUT
          else
            echo "has_flutter=false" >> $GITHUB_OUTPUT
          fi
        shell: bash

      - name: Set up Flutter
        if: steps.check_flutter.outputs.has_flutter == 'true'
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies
        if: steps.check_flutter.outputs.has_flutter == 'true'
        run: flutter pub get
        working-directory: packages/nava_astro_flutter

      - name: Analyze
        if: steps.check_flutter.outputs.has_flutter == 'true'
        run: flutter analyze
        working-directory: packages/nava_astro_flutter

      - name: Test
        if: steps.check_flutter.outputs.has_flutter == 'true'
        run: flutter test
        working-directory: packages/nava_astro_flutter
