name: Multi-Platform Build

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  build-web-and-sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Build Web
        run: npm run build

      - name: Build SDK
        run: |
          cd packages/sdk
          npm ci
          npm run build

  build-flutter:
    name: Flutter Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Check for Flutter project
        id: check_flutter
        run: |
          if [ -f "pubspec.yaml" ]; then
            echo "has_flutter=true" >> $GITHUB_OUTPUT
          else
            echo "has_flutter=false" >> $GITHUB_OUTPUT
          fi
        shell: bash

      - name: Set up Flutter
        if: steps.check_flutter.outputs.has_flutter == 'true'
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies
        if: steps.check_flutter.outputs.has_flutter == 'true'
        run: flutter pub get

      - name: Build Web
        if: steps.check_flutter.outputs.has_flutter == 'true' && matrix.os == 'ubuntu-latest'
        run: flutter build web

      - name: Build Linux
        if: steps.check_flutter.outputs.has_flutter == 'true' && matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ninja-build libgtk-3-dev
          flutter build linux

      - name: Build macOS
        if: steps.check_flutter.outputs.has_flutter == 'true' && matrix.os == 'macos-latest'
        run: flutter build macos

      - name: Build iOS
        if: steps.check_flutter.outputs.has_flutter == 'true' && matrix.os == 'macos-latest'
        run: flutter build ios --release --no-codesign

      - name: Build Windows
        if: steps.check_flutter.outputs.has_flutter == 'true' && matrix.os == 'windows-latest'
        run: flutter build windows

      - name: Build Android APK
        if: steps.check_flutter.outputs.has_flutter == 'true' && matrix.os == 'ubuntu-latest'
        run: flutter build apk
